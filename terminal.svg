<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 215" width="100%" height="215" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
    .header { fill: #161b22; rx: 8; }
    .title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .prompt { fill: #58a6ff; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .label { fill: #8b949e; }
    .val { fill: #c9d1d9; }
    .highlight { fill: #79c0ff; font-weight: 500; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }

    .line { opacity: 0; animation: fadeIn 0.4s ease forwards; }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.6s; }
    .l3 { animation-delay: 1.0s; }
    .l4 { animation-delay: 1.4s; }
    .l5 { animation-delay: 1.8s; }

    .cursor {
      animation: blink 1s infinite steps(1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect width="700" height="215" class="bg" />
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 692 0 C 696.42 0 700 3.58 700 8 L 700 34 L 0 34 Z" class="header" />
  <line x1="0" y1="34" x2="700" y2="34" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="6" class="dot-red" />
  <circle cx="38" cy="17" r="6" class="dot-yellow" />
  <circle cx="56" cy="17" r="6" class="dot-green" />

  <!-- Window Title -->
  <text x="350" y="21" text-anchor="middle" class="title">monzenn@dlsu:~ (bash)</text>

  <!-- Content Lines -->
  <g transform="translate(24, 0)">
    <!-- Command -->
    <g class="line l1" transform="translate(0, 62)">
      <text class="code">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd">monzenn --status</tspan>
      </text>
    </g>

    <!-- Affiliation -->
    <g class="line l2" transform="translate(0, 92)">
      <text class="code">
        <tspan class="label">Affiliation : </tspan>
        <tspan class="val">BS-MS Computer Science </tspan>
        <tspan class="highlight">@ De La Salle University</tspan>
      </text>
    </g>

    <!-- Research -->
    <g class="line l3" transform="translate(0, 120)">
      <text class="code">
        <tspan class="label">Research    : </tspan>
        <tspan class="val">Medical Computer Vision &amp; Deep Learning Diagnostics</tspan>
      </text>
    </g>

    <!-- Frontier -->
    <g class="line l4" transform="translate(0, 148)">
      <text class="code">
        <tspan class="label">Frontier    : </tspan>
        <tspan class="highlight">Test-Time Adaptation (Anatomy-TTA) </tspan>
        <tspan class="val">in Thyroid Ultrasound</tspan>
      </text>
    </g>

    <!-- Tooling -->
    <g class="line l5" transform="translate(0, 176)">
      <text class="code">
        <tspan class="label">Mission     : </tspan>
        <tspan class="val">Reproducible Clinical AI &amp; Open-Access Research Tooling</tspan>
        <tspan class="prompt cursor"> █</tspan>
      </text>
    </g>
  </g>
</svg>
